                      for item in files[:50]:
                          if not isinstance(item, dict) or not isinstance(item.get("originFileName"), str):
                              continue
                          name = item["originFileName"].replace("\n", " ").replace("\r", " ")[:200]
                          for symbol in "\\`*_{}[]<>()!#":
                              name = name.replace(symbol, "\\" + symbol)
                          names.append("- " + name)
