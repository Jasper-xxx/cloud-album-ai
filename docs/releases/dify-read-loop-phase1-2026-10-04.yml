                  r"traceback|stack\s*trace|(?:\w+\.)+(?:\w*Exception|\w*Error)|"
                  r"(?:api[_ -]?key|service[_ -]?key|secret|password|authorization|"
                  r"confirmation[_ -]?token|idempotency[_ -]?key|access[_ -]?token|"
                  r"pending[_ -]?action[_ -]?id|签名|密钥|凭证|令牌)\s*[\"']?\s*[:=])",
                  value,
              ):
                  return "[敏感内容已省略]"[:limit]
              value = re.sub(r"(?i)\b(?:https?|s3|minio|file|ftp)://[^\s<>\"']+", "[链接已省略]", value)
              value = re.sub(r"(?i)\bwww\.[^\s<>\"']+", "[链接已省略]", value)
              value = re.sub(r"(?i)\bBearer\s+[A-Za-z0-9._~+/=-]+", "[凭据已省略]", value)
              value = re.sub(r"\b(?:sk-[A-Za-z0-9_-]{12,}|AKIA[A-Z0-9]{16}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)\b", "[凭据已省略]", value)
              # Includes object keys such as bucket/user/image.jpg, drive and UNC paths.
              value = re.sub(r"(?:[A-Za-z]:[\\/]|\\\\|/)[^\s<>\"']+", "[路径已省略]", value)
              value = re.sub(r"\b[^\s<>\"'/:]+(?:/[^\s<>\"']+)+", "[路径已省略]", value)
              value = re.sub(r"\b[A-Za-z0-9_-]{40,}\b", "[不透明内容已省略]", value)
              value = re.sub(r"[\x00-\x1f\x7f-\x9f\u202a-\u202e\u2066-\u2069]", " ", value)
              return value[:limit]


          def _o_transport_category(error):
              # Only classify the raw error. Never return it, even after attempted scrub.
              value = error if isinstance(error, str) else ""
              value = value[:8192].lower()
              if re.search(r"\b401\b|unauthorized|not.?logged.?in", value):
                  return "AUTH_REQUIRED"
              if re.search(r"\b40[23]\b|forbidden|access denied", value):
                  return "ACCESS_DENIED"
              if re.search(r"\b429\b|quota|rate.?limit|配额", value):
                  return "RATE_LIMITED"
              if re.search(r"\b404\b|endpoint.?not.?found|no route", value):
                  return "ENDPOINT_NOT_FOUND"
              if re.search(r"timeout|timed out|超时", value):
                  return "TIMEOUT"
              if re.search(r"\b5\d\d\b", value):
                  return "SERVER_ERROR"
              if re.search(r"connection|connect error|dns|name resolution|连接", value):
                  return "CONNECTION_ERROR"
              if re.search(r"\b400\b", value):
                  return "INVALID_PARAMETERS"
              return "TRANSPORT_ERROR"


          import json


          import re


          def _s_json(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False)


          def _s_load(raw):
              state = json.loads(raw)
              if not isinstance(state, dict) or state.get("schemaVersion") != 1:
                  raise ValueError("INVALID_STATE")
              return state


          def _s_stop(state, status, reason):
              state["status"] = status
              state["stopReason"] = reason
              state["nextAction"] = {}
              return state


          def _s_has_evidence(state):
              return any(obs.get("ok") for obs in state["observations"])


          def _s_failure(state, reason, clarification=False):
              return _s_stop(state, "PARTIAL" if _s_has_evidence(state) else ("NEEDS_CLARIFICATION" if clarification else "FAILED"), reason)


          def _s_output(state):
              raw = _s_json(state)
              if len(raw.encode("utf-8")) > state["cfg"]["maxStateBytes"]:
                  _s_stop(state, "BUDGET_EXCEEDED", "STATE_SIZE_LIMIT")
                  state["truncated"] = True
                  # No subsequent action may resolve dropped references after this terminal.
                  state["evidenceMap"] = {}
                  for obs in state["observations"]:
                      obs["records"] = []
                      obs["summary"] = {}
                      obs["conditionSummary"] = safe_text(obs.get("conditionSummary", ""), 200)
                      obs["relaxSuggestions"] = []
                  state["query"] = ""
                  state["pending"] = {}
                  raw = _s_json(state)
                  if len(raw.encode("utf-8")) > state["cfg"]["maxStateBytes"]:
                      state["lockedConstraints"] = {}
                      state["observations"] = [{k: o[k] for k in ("ref", "tool", "ok", "count", "errorCategory") if k in o} for o in state["observations"]]
                      raw = _s_json(state)
              return {"state": raw, "status": state["status"]}


          def observe_failure(state, transport_error):
              """A failed tool exits immediately; never pass error text to a model/log."""
              state = _s_load(state)
              category = _o_transport_category(transport_error or "TOOL_FAILURE")
              pending = state["pending"]
              state["observations"].append({"ref": "observation_" + str(len(state["observations"]) + 1),
                  "tool": pending.get("tool", "unknown"), "ok": False, "count": 0,
                  "errorCategory": category, "parameters": {}, "pagination": {}, "records": [],
                  "summary": {}, "conditionSummary": "", "relaxSuggestions": []})
              return _s_output(_s_failure(state, category))


          def main(state, transport_error) -> dict:
              return observe_failure(state, transport_error)
