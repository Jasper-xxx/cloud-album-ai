              if re.search(r"timeout|timed out|超时", value):
                  return "TIMEOUT"
              if re.search(r"\b5\d\d\b", value):
                  return "SERVER_ERROR"
              if re.search(r"connection|connect error|dns|name resolution|连接", value):
                  return "CONNECTION_ERROR"
              if re.search(r"\b400\b", value):
                  return "INVALID_PARAMETERS"
              return "TRANSPORT_ERROR"


          def _o_business_category(code):
              return {400: "INVALID_PARAMETERS", 401: "AUTH_REQUIRED",
                      402: "ACCESS_DENIED", 403: "ACCESS_DENIED",
                      404: "RESOURCE_NOT_FOUND", 429: "RATE_LIMITED"}.get(
                          code, "SERVER_ERROR" if code >= 500 else "BUSINESS_FAILURE")


          def _o_id(value, numeric=False):
              if numeric:
                  if isinstance(value, str) and re.fullmatch(r"[1-9][0-9]{0,18}", value):
                      return str(_o_int(int(value), 1))
                  return str(_o_int(value, 1))
              if not isinstance(value, str) or not re.fullmatch(r"[A-Za-z0-9_-]{1,128}", value):
                  raise _ObservationError("INVALID_RESULT")
              return value


          def _o_record(kind, identifier, raw_name):
              name = _o_string(raw_name, required=True)
              record = {"id": identifier, "kind": kind, "name": name}
              if name != raw_name:
                  record["unsafeName"] = True
              return record


          def _o_optional_fields(source, record, strings=(), counts=(), booleans=()):
              for key in strings:
                  if key in source and source[key] is not None:
                      record[key] = _o_string(source[key])
              for key in counts:
                  if key in source and source[key] is not None:
                      record[key] = _o_int(source[key])
              for key in booleans:
                  if key in source and source[key] is not None:
                      if type(source[key]) is not bool:
                          raise _ObservationError("INVALID_RESULT")
                      record[key] = source[key]


          def _o_photo(row, advanced=False):
              row = _o_dict(row)
              record = _o_record("photo", _o_id(row.get("fileId")), row.get("originFileName"))
              _o_optional_fields(row, record, counts=("size", "width", "height", "duration"))
              if row.get("category") is not None:
                  category = row["category"]
                  if category not in {"image", "video", "doc", "audio", "other"}:
                      raise _ObservationError("INVALID_RESULT")
                  record["category"] = category
              if row.get("contentType") is not None:
                  if not isinstance(row["contentType"], str) or not re.fullmatch(r"[A-Za-z0-9.+-]+/[A-Za-z0-9.+-]+", row["contentType"]):
                      raise _ObservationError("INVALID_RESULT")
                  record["contentType"] = row["contentType"][:100]
              if advanced:
                  _o_optional_fields(row, record,
                                     strings=("takenAt", "uploadedAt", "make", "model", "country", "province", "city", "district"),
                                     booleans=("hasLocation", "hasFeature", "hasAiAnalysis"))
                  record["tags"] = [_o_string(tag, required=True, limit=80) for tag in _o_list(row.get("tags"), 100)]
              return record


          def _o_album(row):
              row = _o_dict(row)
              record = _o_record("album", _o_id(row.get("albumId"), numeric=True), row.get("albumName"))
              # selectAllAlbum is the normal-album query. An explicit different type
              # cannot be repurposed as a normal album evidence reference.
              if row.get("type") not in (None, "normal"):
                  raise _ObservationError("INVALID_RESULT")
              _o_optional_fields(row, record, counts=("imageCount", "videoCount"), strings=("createTime", "updateTime"))
              return record


          def _o_location(row):
              row = _o_dict(row)
              if row.get("locationLevel") not in {"country", "province", "city", "district"}:
                  raise _ObservationError("INVALID_RESULT")
              record = _o_record("location", None, row.get("locationValue"))
              record.update(locationLevel=row["locationLevel"], locationValue=record["name"], total=_o_int(row.get("total")))
              return record


          def _o_model(row):
              row = _o_dict(row)
              record = _o_record("model", None, row.get("modelName"))
              record.update(modelName=record["name"], makeName=_o_string(row.get("makeName")), total=_o_int(row.get("total")))
              if record["makeName"] != (row.get("makeName") or ""):
                  record["unsafeName"] = True
              return record


          def _o_person(row):
              row = _o_dict(row)
              # Backend names may be null before a person group is named. Keep that
              # group visible but do not invent a name that could match user input.
              raw_name = row.get("personName")
              if raw_name is None or raw_name == "":
                  record = {"id": _o_id(row.get("personId"), numeric=True), "kind": "person", "name": "", "unsafeName": True}
              else:
                  record = _o_record("person", _o_id(row.get("personId"), numeric=True), raw_name)
              _o_optional_fields(row, record, counts=("total",), strings=("createTime",))
              return record


          def _o_tag(row):
              row = _o_dict(row)
              record = _o_record("tag", None, row.get("tagName"))
              record.update(tagName=record["name"], count=_o_int(row.get("count")))
              return record


          def _o_pagination(data, returned_count, advanced=False):
              current = _o_int(data.get("current"), 1, 2147483647)
              size = _o_int(data.get("size"), 1, 1000)
              total = _o_int(data.get("total"))
              pages = _o_int(data.get("pages"))
              if pages != (total + size - 1) // size:
                  raise _ObservationError("INVALID_RESULT")
              has_next = current < pages
              if advanced or "hasNext" in data:
                  if type(data.get("hasNext")) is not bool or data["hasNext"] != has_next:
                      raise _ObservationError("INVALID_RESULT")
              # Page counts refer to SQL rows (files), not date buckets. Incomplete
              # pages must not establish a unique album/person-name match.
              expected = max(0, min(size, total - (current - 1) * size))
              if returned_count != expected:
                  raise _ObservationError("INVALID_RESULT")
              return {"current": current, "size": size, "total": total, "pages": pages,
                      "hasNext": has_next, "returnedCount": returned_count, "truncated": False}


          def _o_relax_suggestions(value):
              codes = {"tags_and_to_or", "expand_date_range", "relax_location", "remove_album_scope",
                       "remove_completeness_filter", "remove_keyword"}
              result = []
              for row in _o_list(value, 10):
                  row = _o_dict(row)
                  if row.get("code") not in codes:
                      raise _ObservationError("INVALID_RESULT")
                  result.append({"code": row["code"], "message": _o_string(row.get("message"), required=True)})
              return result


          def _o_capabilities(data):
              data = _o_dict(data)
              summary = {"name": _o_string(data.get("name"), required=True),
                         "mode": _o_string(data.get("mode"), required=True)}
              # These are descriptive output, never a replacement for the tool whitelist.
              for key in ("readOnlyTools", "directMutationTools", "confirmationRequiredTools", "disabledTools"):
                  values = _o_list(data.get(key), 100)
                  if any(not isinstance(value, str) or not re.fullmatch(r"[a-z][a-z0-9_]{0,79}", value) for value in values):
                      raise _ObservationError("INVALID_RESULT")
                  summary[key] = values
              summary["riskRules"] = [_o_string(rule, required=True, limit=300) for rule in _o_list(data.get("riskRules"), 20)]
              return summary


          def _o_analysis(data):
              data = _o_dict(data)
              summary = {"generatedAt": _o_string(data.get("generatedAt"), required=True, limit=64),
                         "staleMinutes": _o_int(data.get("staleMinutes"), 1, 10080),
                         "healthScore": _o_int(data.get("healthScore"), 0, 100)}
              if data.get("healthLevel") not in {"EMPTY", "EXCELLENT", "GOOD", "NEEDS_ATTENTION", "CRITICAL"}:
                  raise _ObservationError("INVALID_RESULT")
              summary["healthLevel"] = data["healthLevel"]
              for key in ("totalFileCount", "untaggedFileCount", "missingLocationFileCount", "missingFeatureFileCount",
                          "missingAiAnalysisFileCount", "similarGroupCount", "similarFileCount", "failedAiTaskCount",
                          "staleAiTaskCount", "pendingAiTaskCount", "unalbumedFileCount"):
                  summary[key] = _o_int(data.get(key))
              summary["suggestions"] = []
              for row in _o_list(data.get("suggestions"), 20):
                  row = _o_dict(row)
                  if row.get("priority") not in {"LOW", "MEDIUM", "HIGH"}:
                      raise _ObservationError("INVALID_RESULT")
                  suggestion = {"priority": row["priority"], "affectedCount": _o_int(row.get("affectedCount"))}
                  for key in ("code", "title", "description", "recommendedAction"):
                      suggestion[key] = _o_string(row.get(key), required=True, limit=300)
                  filters = _o_dict(row.get("suggestedFilters"))
                  safe_filters = {}
                  # Exact fields currently generated by AgentLibraryService, not a
                  # recursive pass-through of its Map<String,Object>.
                  for key in ("missingLocation", "missingFeature", "missingAiAnalysis", "withoutNormalAlbum"):
                      if key in filters:
                          if type(filters[key]) is not bool:
                              raise _ObservationError("INVALID_RESULT")
                          safe_filters[key] = filters[key]
                  for key in ("staleMinutes", "similarGroupCount"):
                      if key in filters:
                          safe_filters[key] = _o_int(filters[key])
                  if "tagState" in filters:
                      if filters["tagState"] != "untagged":
                          raise _ObservationError("INVALID_RESULT")
                      safe_filters["tagState"] = "untagged"
                  if "statuses" in filters:
                      statuses = _o_list(filters["statuses"], 2)
                      if any(status not in {"FAILED", "DEAD"} for status in statuses):
                          raise _ObservationError("INVALID_RESULT")
                      safe_filters["statuses"] = statuses
                  suggestion["suggestedFilters"] = safe_filters
                  summary["suggestions"].append(suggestion)
              return summary


          def adapt_result(tool, text, json_value=None, transport_error=""):
              """Validate one real tool result; no retries, model calls or repairs.

              Nonempty transport_error always wins over apparent success. An exact
              duplicate text/json envelope is accepted; conflicting wrappers are rejected.
              Backend BaseResponse exposes no machine-checkable lossless repair contract,
              so repair is always None. Error messages are never passed through.
              """
              if tool not in _O_TOOLS:
                  return _o_fail("UNSUPPORTED_TOOL")
              if transport_error:
                  return _o_fail(_o_transport_category(transport_error))
              code = None
              try:
                  envelopes = []
                  if text not in (None, ""):
                      envelopes.append(_o_envelope(text))
                  if json_value not in (None, "", []):
                      envelopes.append(_o_envelope(json_value))
                  if not envelopes:
                      return _o_fail("INVALID_RESULT")
                  canonical = [json.dumps(item, sort_keys=True, ensure_ascii=False, allow_nan=False) for item in envelopes]
                  if len(set(canonical)) != 1:
                      return _o_fail("CONFLICTING_ENVELOPES")
                  envelope = envelopes[0]
                  code = envelope["code"]
                  if code != 200:
                      return _o_fail(_o_business_category(code), code)
                  result = _o_success()
                  data = envelope["data"]
                  if tool == "getAgentCapabilities":
                      result["summary"] = _o_capabilities(data)
                      return result
                  if tool == "analyzeLibrary":
                      result["summary"] = _o_analysis(data)
                      return result
                  if tool == "listTags":
                      result["records"] = [_o_tag(row) for row in _o_list(data)]
                      count = len(result["records"])
                      result["pagination"] = {"current": 1, "size": count, "total": count,
                                              "pages": 1 if count else 0, "hasNext": False,
                                              "returnedCount": count, "truncated": False}
                  else:
                      data = _o_dict(data)
                      rows = _o_list(data.get("records"))
                      if tool == "searchFiles":
                          records = []
                          for group in rows:
                              group = _o_dict(group)
                              # Java's Time field is normally serialized as time by
                              # Jackson/Lombok. Tolerate exported capital-Time spelling.
                              if "time" in group and "Time" in group and group["time"] != group["Time"]:
                                  raise _ObservationError("INVALID_RESULT")
                              group_time = group.get("time", group.get("Time"))
                              if group_time is not None and (not isinstance(group_time, str) or not re.fullmatch(r"\d{4}-\d{2}-\d{2}", group_time)):
                                  raise _ObservationError("INVALID_RESULT")
                              for row in _o_list(group.get("fileList")):
                                  record = _o_photo(row)
                                  if group_time is not None:
                                      record["groupDate"] = group_time
                                  records.append(record)
                                  if len(records) > _O_MAX_RECORDS:
                                      raise _ObservationError("RESULT_TOO_LARGE")
                      elif tool == "advancedSearchFiles":
                          records = [_o_photo(row, advanced=True) for row in rows]
                          result["conditionSummary"] = _o_string(data.get("conditionSummary"), required=True, limit=1200)
                          result["relaxSuggestions"] = _o_relax_suggestions(data.get("relaxSuggestions"))
                      else:
                          adapter = {"listAlbums": _o_album, "listLocationAlbums": _o_location,
                                     "listModelAlbums": _o_model, "listPeople": _o_person}[tool]
                          records = [adapter(row) for row in rows]
                      result["records"] = records
                      result["pagination"] = _o_pagination(data, len(records), tool == "advancedSearchFiles")
                  identifiers = [(record["kind"], record["id"]) for record in result["records"] if record["id"] is not None]
                  if len(set(identifiers)) != len(identifiers):
                      raise _ObservationError("INVALID_RESULT")
                  result["summary"] = {"returnedCount": len(result["records"])}
                  return result
              except _ObservationError as error:
                  return _o_fail(str(error), code)
              except (ValueError, TypeError, KeyError, OverflowError, RecursionError):
                  return _o_fail("INVALID_RESULT", code)


          import json


          import time


          import re


          _S_GOAL_TOOL = {
              "search_photos": {"searchFiles", "advancedSearchFiles"},
              "list_albums": {"listAlbums"}, "list_locations": {"listLocationAlbums"},
              "list_models": {"listModelAlbums"}, "list_tags": {"listTags"},
              "list_people": {"listPeople"}, "capabilities": {"getAgentCapabilities"},
              "analyze_library": {"analyzeLibrary"},
          }


          def _s_json(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False)


          def _s_load(raw):
              state = json.loads(raw)
              if not isinstance(state, dict) or state.get("schemaVersion") != 1:
                  raise ValueError("INVALID_STATE")
              return state


          def _s_stop(state, status, reason):
              state["status"] = status
              state["stopReason"] = reason
              state["nextAction"] = {}
              return state


          def _s_has_evidence(state):
              return any(obs.get("ok") for obs in state["observations"])


          def _s_failure(state, reason, clarification=False):
              return _s_stop(state, "PARTIAL" if _s_has_evidence(state) else ("NEEDS_CLARIFICATION" if clarification else "FAILED"), reason)


          def _s_output(state):
              raw = _s_json(state)
              if len(raw.encode("utf-8")) > state["cfg"]["maxStateBytes"]:
                  _s_stop(state, "BUDGET_EXCEEDED", "STATE_SIZE_LIMIT")
                  state["truncated"] = True
                  # No subsequent action may resolve dropped references after this terminal.
                  state["evidenceMap"] = {}
                  for obs in state["observations"]:
                      obs["records"] = []
                      obs["summary"] = {}
                      obs["conditionSummary"] = safe_text(obs.get("conditionSummary", ""), 200)
                      obs["relaxSuggestions"] = []
                  state["query"] = ""
                  state["pending"] = {}
                  raw = _s_json(state)
                  if len(raw.encode("utf-8")) > state["cfg"]["maxStateBytes"]:
                      state["lockedConstraints"] = {}
                      state["observations"] = [{k: o[k] for k in ("ref", "tool", "ok", "count", "errorCategory") if k in o} for o in state["observations"]]
                      raw = _s_json(state)
              return {"state": raw, "status": state["status"]}


          def _s_budget(state, tool=False):
              cfg = state["cfg"]
              if time.time() - state["startedAt"] >= cfg["softDeadlineSeconds"]:
                  return _s_stop(state, "BUDGET_EXCEEDED", "SOFT_DEADLINE")
              if tool:
                  if state["toolCalls"] >= cfg["maxToolCalls"]:
                      return _s_stop(state, "BUDGET_EXCEEDED", "TOOL_CALL_LIMIT")
              elif state["step"] >= cfg["maxSteps"] or state["llmCalls"] >= cfg["maxLlmCalls"]:
                  return _s_stop(state, "BUDGET_EXCEEDED", "PLANNER_CALL_LIMIT")
              return state


          def _s_safe_parameters(params):
              return {k: v for k, v in params.items() if k not in {"albumId", "personId", "albumRef", "personRef"}}


          def _s_finish_or_continue(state, obs):
              goal = state["pending"]["goalId"]
              tool = obs["tool"]
              if goal in {"resolve_album", "resolve_person"}:
                  key = "albumName" if goal == "resolve_album" else "personName"
                  kind = "album" if goal == "resolve_album" else "person"
                  constraints = state["lockedConstraints"]
                  name = constraints.get(key) or constraints.get("parameters", {}).get(key, "")
                  matches = [ref for ref, item in state["evidenceMap"].items() if item["kind"] == kind and item["name"] == name and not item.get("unsafeName")]
                  # A partial list cannot prove global uniqueness, even with one visible match.
                  if len(matches) != 1 or obs["pagination"].get("current") != 1 or obs["pagination"].get("hasNext", False):
                      return _s_stop(state, "NEEDS_CLARIFICATION", "RESOURCE_AMBIGUOUS_OR_INCOMPLETE")
                  if goal not in state["completedGoals"]:
                      state["completedGoals"].append(goal)
                  state["nextAction"] = {"type": "RESOLVED_RESOURCE", "recordRef": matches[0], "evidenceRef": obs["ref"]}
                  unresolved = [g for g in state["requiredGoals"] if g in {"resolve_album", "resolve_person"} and g not in state["completedGoals"]]
                  if unresolved:
                      state["nextAction"] = {"type": "RESOLVE_NEXT", "goalId": unresolved[0], "evidenceRef": obs["ref"]}
              elif tool == "listTags" and goal == "search_photos":
                  choices = [r["name"] for r in obs["records"] if r["name"] in state["allowTagAlternatives"] and not state["evidenceMap"].get(r["recordRef"], {}).get("unsafeName")]
                  if len(choices) == 1:
                      state["nextAction"] = {"type": "ALTERNATIVE_TAG", "tag": choices[0], "evidenceRef": obs["ref"]}
                  else:
                      _s_stop(state, "NEEDS_CLARIFICATION", "ALTERNATIVE_TAG_AMBIGUOUS")
              elif goal in _S_GOAL_TOOL and tool in _S_GOAL_TOOL[goal]:
                  page = obs["pagination"]
                  if goal == "search_photos" and page.get("hasNext") and state["collectedRecords"] < state["requestedLimit"]:
                      state["nextAction"] = {"type": "NEXT_PAGE", "current": page["current"] + 1, "evidenceRef": obs["ref"]}
                  else:
                      can_alternate = (obs["count"] == 0 and tool == "advancedSearchFiles" and state["allowTagAlternatives"] and state["alternativeCount"] == 0 and len(state["lockedConstraints"]["parameters"].get("tags", [])) == 1 and state["lockedConstraints"]["parameters"].get("tagOperator") == "OR")
                      if can_alternate:
                          state["nextAction"] = {"type": "LOOKUP_ALLOWED_TAGS", "evidenceRef": obs["ref"]}
                      else:
                          if goal not in state["completedGoals"]:
                              state["completedGoals"].append(goal)
                          covered = set(state["requiredGoals"]) <= set(state["completedGoals"])
                          if not covered:
                              _s_failure(state, "UNPROVEN_GOAL", clarification=True)
                          else:
                              _s_stop(state, "NO_RESULTS" if obs["count"] == 0 and goal not in {"capabilities", "analyze_library"} else "COMPLETED", "EMPTY_RESULT" if obs["count"] == 0 and goal not in {"capabilities", "analyze_library"} else "GOALS_SATISFIED")
              else:
                  return _s_failure(state, "UNPROVEN_GOAL", clarification=True)
              if state["status"] == "RUNNING" and not state["nextAction"]:
                  _s_failure(state, "NO_LEGAL_NEXT_STEP", clarification=True)
              if state["status"] == "RUNNING":
                  _s_budget(state)
                  if state["status"] == "RUNNING":
                      _s_budget(state, tool=True)
              return state


          def _s_verified_conditions(pending, result):
              params = pending["parameters"]
              page = result.get("pagination", {})
              if page and "current" in params and (page.get("current") != params["current"] or page.get("size") != params["size"]):
                  return False
              if pending["tool"] != "advancedSearchFiles":
                  return True
              summary = result.get("conditionSummary", "")
              fragments = []
              # Current VO proves the date field, but does not echo exact date bounds.
              # Bounds are frozen/sent deterministically; never claim the summary echoes them.
              if params.get("dateFrom") or params.get("dateTo"):
                  fragments.append(("上传" if params["dateField"] == "uploaded" else "拍摄") + "时间范围")
              for key, label in (("country", "国家"), ("province", "省"), ("city", "城市"), ("district", "区县"), ("make", "设备品牌"), ("model", "设备型号"), ("keyword", "关键词")):
                  if params.get(key):
                      fragments.append(label + "：" + params[key])
              for name, label in (("albumName", "普通相册"), ("personName", "人物分组")):
                  if params.get(name):
                      fragments.append(label + "「" + params[name] + "」")
              for key, label in (("albumId", "普通相册#"), ("personId", "人物相册#")):
                  if params.get(key, -1) != -1:
                      fragments.append(label + str(params[key]))
              if params.get("tags"):
                  fragments.append("标签" + params["tagOperator"] + "：" + "、".join(params["tags"]))
              if params.get("tagState") != "all":
                  fragments.append("标签状态：" + params["tagState"])
              if params.get("normalAlbumState") != "any":
                  fragments.append("未加入普通相册" if params["normalAlbumState"] == "excluded" else "已加入普通相册")
              for key, label in (("locationState", "缺少地点"), ("featureState", "缺少特征"), ("aiAnalysisState", "缺少AI分析")):
                  if params.get(key) != "any":
                      fragments.append(("" if params[key] == "missing" else "不") + label)
              if params.get("mediaTypes"):
                  fragments.append("媒体：" + "、".join(params["mediaTypes"]))
              parts = summary.split("；")
              return all(fragment in parts for fragment in fragments)


          def observe(state, text="", json_value=None, transport_error=""):
              state = _s_load(state)
              pending = state["pending"]
              if state["status"] != "RUNNING" or not pending:
                  return _s_output(_s_failure(state, "MISSING_AUTHORIZED_CALL"))
              result = adapt_result(pending["tool"], text, json_value, transport_error)
              if result["ok"] and not _s_verified_conditions(pending, result):
                  result = {"ok": False, "errorCategory": "EFFECTIVE_CONDITIONS_MISMATCH", "businessCode": 200}
              ref = "observation_" + str(len(state["observations"]) + 1)
              records = result.get("records", [])
              obs = {"ref": ref, "tool": pending["tool"], "parameters": _s_safe_parameters(pending["parameters"]),
                     "ok": result["ok"], "errorCategory": result.get("errorCategory", ""),
                     "businessCode": result.get("businessCode"), "pagination": result.get("pagination", {}),
                     "conditionSummary": result.get("conditionSummary", ""), "relaxSuggestions": result.get("relaxSuggestions", []),
                     "summary": result.get("summary", {}), "count": len(records), "records": [],
                     "elapsedMs": max(0, round((time.time() - pending["startedAt"]) * 1000))}
              # Keep raw numeric resource selectors on the code side, even in summaries.
              for key, label in (("albumId", "普通相册#"), ("personId", "人物相册#")):
                  identifier = pending["parameters"].get(key, -1)
                  if identifier != -1:
                      record = next((r for r in state["evidenceMap"].values() if r["id"] == str(identifier)), {})
                      obs["conditionSummary"] = obs["conditionSummary"].replace(label + str(identifier), "普通相册「" + record.get("name", "已验证资源") + "」" if key == "albumId" else "人物分组「" + record.get("name", "已验证资源") + "」")
              state["nextAction"] = {}
              for record in records:
                  if len(state["evidenceMap"]) >= state["cfg"]["maxCollectedRecords"]:
                      state["truncated"] = True
                      break
                  existing = next((key for key, item in state["evidenceMap"].items() if item["kind"] == record["kind"] and item["id"] == record["id"] and (record["id"] is not None or item["name"] == record["name"])), None)
                  record_ref = existing or "record_" + str(len(state["evidenceMap"]) + 1)
                  if not existing:
                      state["evidenceMap"][record_ref] = dict(record, observationRef=ref)
                      if record["kind"] == "photo":
                          state["collectedRecords"] += 1
                  public_record = {k: v for k, v in record.items() if k not in {"id", "unsafeName"}}
                  public_record["recordRef"] = record_ref
                  obs["records"].append(public_record)
              state["observations"].append(obs)
              # One aggregate evidence budget across all iterations, including text fields.
              while len(_s_json(state["observations"])) > state["cfg"]["maxObservationChars"]:
                  candidate = next((o for o in state["observations"] if o["records"]), None)
                  if candidate:
