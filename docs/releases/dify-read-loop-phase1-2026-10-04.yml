    - data:
        code: |
          def main(raw) -> dict:
              import json

              if isinstance(raw, str):
                  try:
                      raw = json.loads(raw)
                  except Exception:
                      raw = {}
              envelope = raw if isinstance(raw, dict) else {}
              data = envelope.get("data") if envelope.get("code") == 200 and isinstance(envelope.get("data"), dict) else {}
              if any(type(data.get(k, 0)) is not int for k in ("actualAffectedFileCount", "actualCreatedAlbumCount", "skippedFileCount")):
                  data = {}
              status = str(data.get("status") or "").upper()
              affected = int(data.get("actualAffectedFileCount") or 0)
              created = int(data.get("actualCreatedAlbumCount") or 0)
              skipped = int(data.get("skippedFileCount") or 0)
              if status == "SUCCEEDED":
                  message = f"操作已成功完成：实际处理 {affected} 张照片，创建 {created} 个相册，跳过 {skipped} 张。"
              elif status == "EXECUTING":
                  message = "操作仍在执行中。你可以稍后回复「查询执行状态」。"
              elif status == "PREVIEWED":
                  message = "操作仍在等待确认。回复「确认」执行，或回复「取消」放弃。"
              elif status == "FAILED":
                  message = str(data.get("failureMessage") or "执行未完成，请重新预览。")
              elif status == "CANCELLED":
                  message = "本次待执行操作已取消，没有继续修改。"
              elif status == "EXPIRED":
                  message = "本次确认已过期，请重新发起预览。"
              else:
                  message = "暂时无法确认操作状态，请稍后再次查询。"
              terminal = status in {"SUCCEEDED", "FAILED", "CANCELLED", "EXPIRED"}
              return {"publicMessage": message, "terminal": terminal, "empty": ""}
        code_language: python3
        outputs:
          publicMessage:
            children: null
            type: string
          terminal:
            children: null
            type: boolean
          empty:
            children: null
            type: string
        selected: false
        title: 状态结果脱敏
        type: code
        variables:
        - value_selector:
          - tool_get_pending_action_status
          - text
          variable: raw
