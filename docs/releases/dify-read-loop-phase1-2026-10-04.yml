                  warnings = data.get("warnings")
                  if isinstance(warnings, list):
                      message += "\n" + "；".join(value for value in warnings if isinstance(value, str))
                  result.update(message=message, publicMessage=message)
              except (ValueError, TypeError):
                  pass
              return result
