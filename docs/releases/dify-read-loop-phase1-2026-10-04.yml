    - data:
        code: |
          def main(raw: str, current_query: str = "", pending_action_id: str = "") -> dict:
              import json
              import re
              import unicodedata

              defaults = {
                  "selectedTool": "none", "current": 1, "size": 20,
                  "orderType": "desc", "orderKeyword": "date_time_original",
                  "imageTypeText": "all", "locationLevel": "",
                  "locationValue": "", "albumId": -1, "albumName": "", "tagFilter": "all",
                  "tagName": "", "searchType": "", "searchKeyword": "",
                  "dateField": "taken", "dateFrom": "", "dateTo": "",
                  "tags": [], "tagOperator": "OR", "country": "",
                  "province": "", "city": "", "district": "", "make": "",
                  "model": "", "personId": -1, "personName": "", "withoutNormalAlbum": None,
                  "normalAlbumState": "any", "mediaTypes": [], "tagState": "all",
                  "missingLocation": None, "missingFeature": None, "missingAiAnalysis": None,
                  "locationState": "any", "featureState": "any", "aiAnalysisState": "any",
                  "keyword": "", "orderBy": "takenAt", "staleMinutes": 60,
                  "display": True, "directReply": ""
              }
              try:
                  match = re.search(r"\{[\s\S]*\}", raw or "")
                  value = json.loads(match.group(0) if match else raw)
                  if isinstance(value, dict):
                      defaults.update(value)
              except Exception:
                  defaults["directReply"] = "我还不能确定要查询哪类内容，请告诉我想查照片、相册、标签还是人物。"

              allowed = {
                  "getAgentCapabilities", "searchFiles", "listAlbums",
                  "listLocationAlbums", "listModelAlbums", "listTags",
                  "listPeople", "advancedSearchFiles", "analyzeLibrary",
                  "discoverSimilarFiles", "none"
              }
              # Invalid model field types must not reach enum membership operations.
              for key in ["selectedTool", "orderType", "orderKeyword", "imageTypeText", "locationLevel", "tagFilter", "searchType", "dateField", "tagOperator", "tagState", "orderBy"]:
                  if not isinstance(defaults.get(key, ""), str):
                      defaults[key] = ""
                      defaults["selectedTool"] = "none"
                      defaults["directReply"] = "查询参数类型无效，请重新说明筛选条件。"
              if defaults["selectedTool"] not in allowed:
                  defaults["selectedTool"] = "none"

              normalized_query = unicodedata.normalize("NFKC", str(current_query or "")).strip().lower()
              normalized_query = re.sub(r"[。.!！?？]+$", "", normalized_query).strip()
              vague_confirmations = {'ok', 'okay', 'sure', 'yes', '可以', '可以啊', '可以的', '同意', '嗯', '嗯嗯', '好', '好吧', '好呀', '好啊', '好的', '对', '对的', '就这样', '当然可以', '是', '是啊', '是的', '没错', '没问题', '行', '行吧', '行啊', '行的', '要', '需要'}
              high_risk_markers = {
                  "删除照片", "删除文件", "删除相册", "永久删除", "清空回收站",
                  "创建分享", "分享链接", "下载token", "下载 token",
                  "修改账号", "修改密码", "重置密码"
              }
              if normalized_query in vague_confirmations and str(pending_action_id or "").strip():
                  defaults["selectedTool"] = "none"
                  defaults["directReply"] = "这句话不会触发执行。若要执行刚才的预览，请明确回复「确认」；也可以回复「取消」。"
              elif any(marker in normalized_query for marker in {"相似照片", "重复照片", "照片查重", "相似图片", "重复图片"}):
                  defaults["selectedTool"] = "discoverSimilarFiles"
                  defaults["directReply"] = ""
              elif any(marker in normalized_query for marker in high_risk_markers):
                  defaults["selectedTool"] = "none"
                  defaults["directReply"] = "这类高风险操作不在云忆助手的可执行范围内，我不会调用工具或修改数据。"
              positive_location_markers = {"有地理位置信息", "带地理位置信息", "包含地理位置", "有gps", "带gps", "包含gps", "有定位信息"}
              missing_location_markers = {"缺少地理位置", "没有地理位置", "无地理位置", "缺少gps", "没有gps", "无gps", "缺少定位信息"}
              if any(marker in normalized_query for marker in positive_location_markers):
                  defaults["selectedTool"] = "advancedSearchFiles"
                  defaults["locationState"] = "present"
              elif any(marker in normalized_query for marker in missing_location_markers):
                  defaults["selectedTool"] = "advancedSearchFiles"
                  defaults["locationState"] = "missing"

              query_text = str(current_query or "").strip()
              album_name_match = re.search(
                  r'在\s*[“"「『]([^”"」』]{1,100})[”"」』]\s*中',
                  query_text
              )
              person_name_match = re.search(
                  r'(?:人物分组|人物相册)\s*(?:为|是|叫|名称为)?\s*[“"「『]([^”"」』]{1,100})[”"」』]',
                  query_text
              )
              if (album_name_match and person_name_match
                      and not str(defaults.get("directReply") or "").strip()):
                  defaults["selectedTool"] = "advancedSearchFiles"
                  defaults["albumId"] = -1
                  defaults["albumName"] = album_name_match.group(1).strip()
                  defaults["personId"] = -1
                  defaults["personName"] = person_name_match.group(1).strip()
                  defaults["tags"] = []
                  defaults["tagName"] = ""
                  defaults["searchType"] = ""
                  defaults["searchKeyword"] = ""
                  defaults["keyword"] = ""
              try:
                  defaults["current"] = max(1, int(defaults.get("current") or 1))
              except Exception:
                  defaults["current"] = 1
              try:
                  defaults["size"] = min(50, max(1, int(defaults.get("size") or 20)))
              except Exception:
                  defaults["size"] = 20
              try:
                  defaults["albumId"] = int(defaults.get("albumId") or -1)
              except Exception:
                  defaults["albumId"] = -1
              try:
                  defaults["personId"] = int(defaults.get("personId") or -1)
              except Exception:
                  defaults["personId"] = -1
              try:
                  defaults["staleMinutes"] = min(10080, max(5, int(defaults.get("staleMinutes") or 60)))
              except Exception:
                  defaults["staleMinutes"] = 60

              if defaults["orderType"] not in {"asc", "desc"}:
                  defaults["orderType"] = "desc"
              if defaults["orderKeyword"] not in {"date_time_original", "upload_time"}:
                  defaults["orderKeyword"] = "date_time_original"
              if defaults["imageTypeText"] not in {"all", "picture", "gif", "video"}:
                  defaults["imageTypeText"] = "all"
              if defaults["locationLevel"] not in {"", "country", "province", "city", "district"}:
                  defaults["locationLevel"] = ""
              if defaults["tagFilter"] not in {"all", "untagged"}:
                  defaults["tagFilter"] = "all"
              if defaults["searchType"] not in {"", "tag", "model", "location"}:
                  defaults["searchType"] = ""
              if defaults["dateField"] not in {"taken", "uploaded"}:
                  defaults["dateField"] = "taken"
              if defaults["tagOperator"] not in {"AND", "OR"}:
                  defaults["tagOperator"] = "OR"
              if defaults["tagState"] not in {"all", "tagged", "untagged"}:
                  defaults["tagState"] = "all"
              if defaults["orderBy"] not in {"takenAt", "uploadedAt"}:
                  defaults["orderBy"] = "takenAt"

              def normalize_string_list(value, allowed=None, max_items=20):
                  if not isinstance(value, list):
                      return []
                  result = []
                  for item in value:
                      text = str(item or "").strip()
                      if text and (allowed is None or text in allowed) and text not in result:
                          result.append(text)
                      if len(result) >= max_items:
                          break
                  return result

              def normalize_optional_bool(value):
                  if isinstance(value, bool):
                      return value
                  if isinstance(value, str) and value.strip().lower() in {"true", "false"}:
                      return value.strip().lower() == "true"
                  return None

              defaults["tags"] = normalize_string_list(defaults.get("tags"))
              defaults["mediaTypes"] = normalize_string_list(
                  defaults.get("mediaTypes"), {"picture", "gif", "video"}, 3
              )
              for key in ["withoutNormalAlbum", "missingLocation", "missingFeature", "missingAiAnalysis"]:
                  defaults[key] = normalize_optional_bool(defaults.get(key))
              state_rules = {
                  "normalAlbumState": {"any", "included", "excluded"},
                  "locationState": {"any", "missing", "present"},
                  "featureState": {"any", "missing", "present"},
                  "aiAnalysisState": {"any", "missing", "present"}
              }
              for key, allowed_states in state_rules.items():
                  state_value = str(defaults.get(key) or "any").strip().lower()
                  defaults[key] = state_value if state_value in allowed_states else "any"
              if defaults["normalAlbumState"] == "any" and defaults["withoutNormalAlbum"] is not None:
                  defaults["normalAlbumState"] = "excluded" if defaults["withoutNormalAlbum"] else "included"
              for legacy_key, state_key in [
                  ("missingLocation", "locationState"),
                  ("missingFeature", "featureState"),
                  ("missingAiAnalysis", "aiAnalysisState")
              ]:
                  if defaults[state_key] == "any" and defaults[legacy_key] is not None:
                      defaults[state_key] = "missing" if defaults[legacy_key] else "present"
              display_value = defaults.get("display", True)
              if isinstance(display_value, bool):
                  defaults["display"] = display_value
              elif isinstance(display_value, str) and display_value.strip().lower() in {"true", "false"}:
                  defaults["display"] = display_value.strip().lower() == "true"
              else:
                  defaults["display"] = True

              for key in [
                  "locationValue", "tagName", "searchKeyword", "directReply",
                  "dateFrom", "dateTo", "country", "province", "city", "district",
                  "make", "model", "albumName", "personName", "keyword"
              ]:
                  defaults[key] = str(defaults.get(key) or "").strip()

              if defaults["selectedTool"] == "searchFiles":
                  if defaults["searchType"] and not defaults["searchKeyword"]:
                      defaults["selectedTool"] = "none"
                      defaults["directReply"] = "请再告诉我具体的标签、地点或设备名称。"
                  if defaults["searchType"] == "tag" and not defaults["tagName"]:
                      defaults["tagName"] = defaults["searchKeyword"]
                  if defaults["searchType"] == "location" and not defaults["locationValue"]:
                      defaults["locationValue"] = defaults["searchKeyword"]
                  if defaults["searchType"] == "location" and not defaults["locationLevel"]:
                      defaults["locationLevel"] = "city"

              if defaults["selectedTool"] == "none" and not defaults["directReply"]:
                  defaults["directReply"] = "这个请求目前无法直接处理，请换成照片、相册、标签或人物查询。"
              # No fabricated write confirmation from a read-only model response.
              if re.search(r"确认|是否.*(?:删除|执行)|已(?:经)?(?:删除|移入|完成|执行|创建)", defaults["directReply"]):
                  defaults["selectedTool"] = "none"
                  defaults["directReply"] = "尚未创建新的待确认操作。写操作需要先取得实际预览；请明确要处理的照片范围。"
              return defaults
