    - data:
        code: |-
          def guard_recycle_intent(data, query):
              """Recognize only complete album-photo commands; ambiguous scope stays unconfirmed."""
              import re

              query = re.sub(r"[。.!！?？]+$", "", query.strip())
              data["allRecycleImages"] = False
              # The action determines its endpoint; the model's family label is not authoritative.
              p3 = {"build_image_features", "update_location", "restore_files", "rename_person", "hide_people", "show_people", "move_person_files", "merge_people"}
              p4 = {"create_file_share_link", "create_album_share_link", "create_file_download_token", "create_album_download_token", "move_files_to_recycle_bin", "delete_albums", "permanently_delete_files", "empty_recycle_bin"}
              if data.get("mode") == "preview" and data.get("extendedAction") in p3 | p4:
                  data["family"] = "p3_action" if data["extendedAction"] in p3 else "p4_action"
              recycle_scope = r'回收站(?:里边|里面|里|中)?的?(?:所有|全部)?(?:照片|图片)'
              restore_all = re.fullmatch(r'(?:请|请帮我|帮我)?(?:把|将)?' + recycle_scope + r'(?:全部|都)?(?:恢复|还原)(?:出来)?', query)
              restore_all = restore_all or re.fullmatch(r'(?:请|请帮我|帮我)?(?:恢复|还原)' + recycle_scope, query)
              if restore_all:
                  data.update(mode="preview", family="p3_action", extendedAction="restore_files", allRecycleImages=True,
                              fileIds=[], albumIds=[], albumName="", albumAction="", tagAction="", aiAction="", reason="")
              elif data.get("extendedAction") == "restore_files" and data.get("mode") == "preview":
                  if not data.get("fileIds") or re.search(r'不要|别|不想|如何|怎么|能否|是否|吗', query):
                      data.update(mode="message", family="none", reason="请明确要恢复的照片范围；恢复回收站全部图片可发送「把回收站的照片恢复」。")

              delete_words = r"删除|删掉|删去|移入回收站|放入回收站"
              has_delete = bool(re.search(delete_words, query))
              permanent = bool(re.search(r"永久|彻底|不可恢复|清空回收站", query))
              negative_or_question = bool(re.search(r"不要|别|不想|不需要|不删除|不删|如何|怎么|能否|是否|能不能|可以.*吗", query))
              # Do not resolve filtered subsets (e.g. 最新两张/猫/视频) as the entire album.
              name = r'[“"「『]?([^“”"「」『』\n]{1,100}?)[”"」』]?'
              scope = r'相册\s*' + name + r'\s*(?:里边|里面|里|中)\s*的?\s*(?:所有|全部)?\s*(?:图片|照片)'
              match = re.fullmatch(r'(?:请|帮我|请帮我)?\s*(?:把|将)?\s*' + scope + r'\s*(?:都|全部)?\s*(?:' + delete_words + r')', query)
              if not match:
                  match = re.fullmatch(r'(?:请|帮我|请帮我)?\s*(?:' + delete_words + r')\s*' + scope, query)
              if match and not permanent and not negative_or_question:
                  album_name = match.group(1).strip()
                  # Multiple names and qualifiers need an explicit scope, not a broad guess.
                  if not re.search(r'以及|还有|和|、|，|,|除了|但|只', album_name):
                      data.update(mode="preview", family="p4_action", extendedAction="move_files_to_recycle_bin",
                                  albumName=album_name, fileIds=[], albumIds=[], includePictures=False,
                                  albumAction="", tagAction="", aiAction="", reason="")
                  else:
                      data.update(mode="message", family="none", reason="相册范围有歧义，请一次明确一个相册及照片范围。")
              if has_delete and not permanent and not negative_or_question and data.get("extendedAction") == "permanently_delete_files":
                  data.update(mode="message", family="none", extendedAction="",
                              reason="普通删除应移入回收站。请说明要处理的相册名称或照片范围，以便生成可恢复的预览。")
              if has_delete and negative_or_question and data.get("mode") == "preview":
                  data.update(mode="message", family="none", reason="尚未创建删除预览。删除图片会先移入回收站；需要操作时请明确照片范围。")
              if has_delete and data.get("mode") == "preview" and data.get("extendedAction") == "move_files_to_recycle_bin" and data.get("albumName") and not match:
                  data.update(mode="message", family="none", reason="请明确相册及图片范围；带筛选条件的请求需要先查询具体照片。")
              if has_delete and data.get("mode") in {"none", "message"}:
                  data.update(mode="message", family="none",
                              reason="尚未创建待确认操作。请明确相册名称和照片范围；普通删除会先移入回收站，收到实际预览后才能确认执行。")
              return data


          def main(raw: str, current_query: str = "", pending_action_id: str = "", pending_confirmation_token: str = "", pending_idempotency_key: str = "", pending_family: str = "", agent_task_id: str = "") -> dict:
              import json
              import re
              import unicodedata

              def defaults():
                  return {
                      "mode": "none", "family": "none", "albumAction": "", "tagAction": "", "aiAction": "", "extendedAction": "",
                      "albumName": "", "albumId": -1, "tagName": "", "imageType": "其他",
                      "imageTypeText": "picture", "fileIds": [], "searchType": "", "searchKeyword": "",
                      "mediaType": "", "sourceTagName": "", "locationLevel": "", "locationValue": "", "agentTaskId": "", "applyAll": False, "selectedTagNames": [], "minConfidence": 0.5, "selectionLimit": 1,
                      "albumIds": [], "personIds": [], "sourcePersonId": -1, "targetPersonId": -1,
                      "personName": "", "personRelation": "", "shareDays": 7, "includePictures": False,
                      "allRecycleImages": False, "sourceAlbumId": -1, "confirmed": False, "reason": "", "empty": ""
                  }

              def clean_text(value):
                  value = str(value or "").strip()
                  if value.lower() in {"none", "null", "undefined", "n/a", "na"}:
                      return ""
                  return value

              data = defaults()
              text = raw or ""
              try:
                  m = re.search(r"\{[\s\S]*\}", text)
                  obj = json.loads(m.group(0) if m else text)
                  if isinstance(obj, dict):
                      data.update(obj)
              except Exception as exc:
                  data["reason"] = "write action JSON parse failed: " + str(exc)

              baseline = defaults()
              for key, default in baseline.items():
                  value = data.get(key)
                  if value is None:
                      data[key] = default
                  elif (isinstance(default, str) and not isinstance(value, str)) or (isinstance(default, list) and not isinstance(value, list)) or (isinstance(default, bool) and not isinstance(value, bool)) or (type(default) in (int, float) and (type(value) not in (int, float) or not __import__("math").isfinite(value))):
                      data = defaults()
                      data.update(mode="message", reason="参数类型无效，请重新说明要处理的照片和操作。")
                      return data

              if data["mode"] not in {"none", "preview", "execute", "cancel", "status", "agent_status", "message"}: data["mode"] = "none"
              if data["family"] not in {"none", "album", "tag", "ai_task", "suggested_tag", "p3_action", "p4_action"}: data["family"] = "none"
              if data["albumAction"] not in {"create_album", "create_album_and_add_files", "add_files_to_album", "remove_files_from_album"}: data["albumAction"] = ""
              if data["tagAction"] not in {"add_tags", "remove_tags"}: data["tagAction"] = ""
              if data["aiAction"] not in {"submit_image_tag_task", "apply_suggested_tags"}: data["aiAction"] = ""
              allowed_extended = {"build_image_features", "update_location", "restore_files", "rename_person", "hide_people", "show_people", "move_person_files", "merge_people", "create_file_share_link", "create_album_share_link", "create_file_download_token", "create_album_download_token", "move_files_to_recycle_bin", "delete_albums", "permanently_delete_files", "empty_recycle_bin"}
              if data.get("extendedAction") not in allowed_extended: data["extendedAction"] = ""

              file_ids = data.get("fileIds") or []
              if isinstance(file_ids, str): file_ids = re.findall(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[0-9a-fA-F]{32}", file_ids)
              if not isinstance(file_ids, list): file_ids = []
              clean_ids, seen = [], set()
              for item in file_ids:
                  value = clean_text(item)
                  if value and value not in seen:
                      seen.add(value); clean_ids.append(value)
                  if len(clean_ids) >= 100: break
              data["fileIds"] = clean_ids

              for list_key, limit in [("albumIds", 5), ("personIds", 10)]:
                  raw_ids = data.get(list_key) or []
                  if not isinstance(raw_ids, list): raw_ids = []
                  clean_long_ids = []
                  for item in raw_ids:
                      try:
                          value = int(item)
                          if value > 0 and value not in clean_long_ids: clean_long_ids.append(value)
                      except Exception: pass
                      if len(clean_long_ids) >= limit: break
                  data[list_key] = clean_long_ids
              for key in ["albumId", "sourceAlbumId", "sourcePersonId", "targetPersonId", "shareDays"]:
                  try: data[key] = int(data.get(key) or -1)
                  except Exception: data[key] = -1
              data["shareDays"] = min(30, max(1, data.get("shareDays") or 7))
              data["includePictures"] = data.get("includePictures") is True

              for key in ["albumName", "tagName", "imageType", "imageTypeText", "searchType", "searchKeyword", "mediaType", "sourceTagName", "locationLevel", "locationValue", "reason", "aiAction", "agentTaskId", "extendedAction", "personName", "personRelation"]:
                  data[key] = clean_text(data.get(key))

              selected_names = data.get("selectedTagNames") or []
              if not isinstance(selected_names, list): selected_names = []
              data["selectedTagNames"] = list(dict.fromkeys(clean_text(v) for v in selected_names if clean_text(v)))[:20]
              data["applyAll"] = data.get("applyAll") is True
              try: data["minConfidence"] = min(1.0, max(0.0, float(0.5 if data.get("minConfidence") is None else data["minConfidence"])))
              except Exception: data["minConfidence"] = 0.5
              try: data["selectionLimit"] = min(100, max(1, int(data.get("selectionLimit") or 1)))
              except Exception: data["selectionLimit"] = 1

              query = unicodedata.normalize("NFKC", clean_text(current_query)).strip().lower()
              query = re.sub(r"[。.!！?？]+$", "", query).strip()
              latest_count = re.search(r"(?:最近|最新|近)\s*(\d+)\s*(?:张|个)?", query)
              if latest_count and data["mode"] == "preview" and data["family"] in {"album", "tag"}:
                  requested_count = int(latest_count.group(1))
                  if requested_count < 1 or requested_count > 100:
                      data["mode"] = "message"
                      data["family"] = "none"
                      data["reason"] = "相册或标签整理一次只能选择最近1到100张照片。"
                  else:
                      data["fileIds"] = []
                      data["searchType"] = "latest"
                      data["searchKeyword"] = ""
                      data["selectionLimit"] = requested_count
              ai_tag_request = bool(re.search(r"(?:生成|识别|分析|推荐|建议).{0,20}(?:ai标签|标签建议)|(?:ai标签|标签建议).{0,20}(?:生成|识别|分析|推荐|建议)", query))
              if ai_tag_request and re.search(r"(?:最近|最新|近)", query):
                  requested_count = int(latest_count.group(1)) if latest_count else 1
                  if requested_count < 1 or requested_count > 50:
                      data["mode"] = "message"
                      data["family"] = "none"
                      data["aiAction"] = ""
                      data["reason"] = "AI标签建议任务一次只能选择最近1到50张图片。"
                  else:
                      data["mode"] = "preview"
                      data["family"] = "ai_task"
                      data["aiAction"] = "submit_image_tag_task"
                      data["searchType"] = "latest"
                      data["searchKeyword"] = ""
                      data["selectionLimit"] = requested_count
              empty_album_create = bool(re.search(r"(?:创建|新建|建立).{0,40}相册", query)) and not bool(re.search(r"(?:照片|图片|文件|视频|gif|加入|放入|移入|收进|整理到)", query))
              if empty_album_create:
                  data["mode"] = "preview"
                  data["family"] = "album"
                  data["albumAction"] = "create_album"
                  data["fileIds"] = []
                  data["albumId"] = -1
                  data["searchType"] = ""
                  data["searchKeyword"] = ""
                  if not data["albumName"]:
                      album_match = re.search(r"(?:叫|名为|名称(?:为|是)?)[“\"「『]?(.{1,30}?)[”\"」』]?(?:的)?相册$", query)
                      if album_match: data["albumName"] = album_match.group(1).strip("“”\"「」『』 ")
              read_only_photo_query = bool(re.search(r"(查找|搜索|检索|筛选|查看|找出|列出|显示).*(照片|图片|视频|文件)", query))
              explicit_tag_write = bool(re.search(r"(添加|增加|打上|加上|应用|写入|移除|去掉|删除).{0,8}(标签|标记)|(标签|标记).{0,8}(添加|增加|打上|加上|应用|写入|移除|去掉|删除)|标记为", query))
              if read_only_photo_query and not explicit_tag_write:
                  data["mode"] = "none"
                  data["family"] = "none"
                  data["tagAction"] = ""
                  data["albumAction"] = ""
                  data["aiAction"] = ""
                  data["extendedAction"] = ""
              data = guard_recycle_intent(data, clean_text(current_query))
              exact_confirmations = {"确认", "执行", "确认执行", "开始执行", "可以执行", "同意执行", "confirm", "execute"}
              exact_cancellations = {"取消", "不要执行", "不执行", "cancel"}
              exact_status_queries = {"状态", "查询状态", "执行状态", "查询执行状态", "查看状态", "status"}
              exact_agent_status_queries = {"ai任务状态", "ai标签任务状态", "标签任务状态", "查看ai任务", "查看标签建议", "ai status"}
              pending_family = clean_text(pending_family).lower()
              has_pending = bool(clean_text(pending_action_id) and clean_text(pending_confirmation_token) and clean_text(pending_idempotency_key) and pending_family in {"album", "tag", "ai_task", "suggested_tag", "p3_action", "p4_action"})
              has_pending_id = bool(clean_text(pending_action_id))
              if data["family"] == "suggested_tag" and not data["agentTaskId"]: data["agentTaskId"] = clean_text(agent_task_id)
              if query in exact_agent_status_queries:
                  data["mode"] = "agent_status" if clean_text(agent_task_id) else "message"
                  data["agentTaskId"] = clean_text(agent_task_id)
                  data["family"] = "none"
                  if not data["agentTaskId"]: data["reason"] = "当前没有可查询的AI标签任务。"
              elif query in exact_status_queries:
                  data["mode"] = "status" if has_pending_id else "message"
                  data["family"] = pending_family if pending_family in {"album", "tag", "ai_task", "suggested_tag", "p3_action", "p4_action"} else "none"
                  if not has_pending_id: data["reason"] = "当前没有可查询的待执行操作。"
              elif query in exact_confirmations:
                  data["mode"] = "execute" if has_pending else "message"
                  data["family"] = pending_family if has_pending else "none"
                  if not has_pending: data["reason"] = "没有可确认的待执行操作，请先重新发起整理请求。"
              elif query in exact_cancellations:
                  data["mode"] = "cancel" if has_pending else "message"
                  data["family"] = pending_family if has_pending else "none"
                  if not has_pending: data["reason"] = "没有可取消的待执行操作。"
              elif data["mode"] in {"execute", "cancel"}:
                  data["mode"] = "preview"

              if not data["imageType"]: data["imageType"] = "其他"
              if data["imageTypeText"] not in {"picture", "gif", "video", "all"}: data["imageTypeText"] = "picture"
              if data["searchType"] not in {"", "tag", "location", "model", "latest", "all"}: data["searchType"] = ""
              if data["locationLevel"] not in {"", "country", "province", "city", "district"}: data["locationLevel"] = ""
              if not data["searchKeyword"] and data["mediaType"]: data["searchKeyword"] = data["mediaType"]
              if data["searchType"] in {"", "tag"}: data["mediaType"] = ""
              if data["searchKeyword"] and not data["searchType"]: data["searchType"] = "tag"

              data["confirmed"] = data["mode"] == "execute"
              if data["mode"] == "preview" and data["family"] == "album" and not data["albumAction"]: data["mode"] = "none"
              if data["mode"] == "preview" and data["family"] == "tag" and not data["tagAction"]: data["mode"] = "none"
              if data["mode"] == "preview" and data["family"] in {"ai_task", "suggested_tag"} and not data["aiAction"]: data["mode"] = "none"
              if data["mode"] == "preview" and data["family"] in {"p3_action", "p4_action"} and not data["extendedAction"]: data["mode"] = "none"
              if data["family"] == "none" and data["mode"] in {"preview", "execute", "cancel"}: data["mode"] = "none"
              return data
