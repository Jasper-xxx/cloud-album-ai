              "analyzeLibrary",
          ))


          _O_MAX_INPUT_BYTES = 524288


          _O_MAX_RECORDS = 1000


          _O_LONG_MAX = 9223372036854775807


          class _ObservationError(ValueError):
              pass


          def safe_text(value, limit=240):
              """Return bounded display data; never stringify arbitrary objects/secrets.

