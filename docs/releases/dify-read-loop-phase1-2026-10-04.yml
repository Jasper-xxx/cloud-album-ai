        - input_type: variable
          operation: over-write
          write_mode: over-write
          value:
          - read_loop_planner_next
          - text
          variable_selector:
          - read_loop
          - planRaw
        isInIteration: false
        isInLoop: true
        loop_id: read_loop
      position:
        x: 680
