    - id: read_loop_prepare
      type: custom
      data:
        type: code
        title: read_loop_prepare
        code_language: python3
        code: |
          import json


          import re


          import json


          import re


          def safe_text(value, limit=240):
              """Return bounded display data; never stringify arbitrary objects/secrets.

              This is deliberately conservative. If a name changes, adapters flag it as
              unsafeName so redaction/truncation cannot create a false exact-name match.
              Text is still untrusted data, not a source of planner instructions.
              """
              if not isinstance(value, str):
                  return ""
              limit = max(0, min(limit, 4096)) if type(limit) is int else 240
              if len(value) > 16384:
                  return "[过长文本已省略]"[:limit]
              if re.search(
                  r"(?i)(?:feature[_ -]?vector|embedding|\bvector\s*[:=]|"
                  r"traceback|stack\s*trace|(?:\w+\.)+(?:\w*Exception|\w*Error)|"
                  r"(?:api[_ -]?key|service[_ -]?key|secret|password|authorization|"
                  r"confirmation[_ -]?token|idempotency[_ -]?key|access[_ -]?token|"
                  r"pending[_ -]?action[_ -]?id|签名|密钥|凭证|令牌)\s*[\"']?\s*[:=])",
                  value,
              ):
                  return "[敏感内容已省略]"[:limit]
              value = re.sub(r"(?i)\b(?:https?|s3|minio|file|ftp)://[^\s<>\"']+", "[链接已省略]", value)
              value = re.sub(r"(?i)\bwww\.[^\s<>\"']+", "[链接已省略]", value)
              value = re.sub(r"(?i)\bBearer\s+[A-Za-z0-9._~+/=-]+", "[凭据已省略]", value)
              value = re.sub(r"\b(?:sk-[A-Za-z0-9_-]{12,}|AKIA[A-Z0-9]{16}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)\b", "[凭据已省略]", value)
              # Includes object keys such as bucket/user/image.jpg, drive and UNC paths.
              value = re.sub(r"(?:[A-Za-z]:[\\/]|\\\\|/)[^\s<>\"']+", "[路径已省略]", value)
              value = re.sub(r"\b[^\s<>\"'/:]+(?:/[^\s<>\"']+)+", "[路径已省略]", value)
              value = re.sub(r"\b[A-Za-z0-9_-]{40,}\b", "[不透明内容已省略]", value)
              value = re.sub(r"[\x00-\x1f\x7f-\x9f\u202a-\u202e\u2066-\u2069]", " ", value)
              return value[:limit]


          import json


          import time


          import re


          def _s_json(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False)


          def _s_load(raw):
              state = json.loads(raw)
              if not isinstance(state, dict) or state.get("schemaVersion") != 1:
                  raise ValueError("INVALID_STATE")
              return state


          def _s_stop(state, status, reason):
              state["status"] = status
              state["stopReason"] = reason
              state["nextAction"] = {}
              return state


          def _s_output(state):
              raw = _s_json(state)
              if len(raw.encode("utf-8")) > state["cfg"]["maxStateBytes"]:
                  _s_stop(state, "BUDGET_EXCEEDED", "STATE_SIZE_LIMIT")
                  state["truncated"] = True
                  # No subsequent action may resolve dropped references after this terminal.
                  state["evidenceMap"] = {}
                  for obs in state["observations"]:
                      obs["records"] = []
                      obs["summary"] = {}
                      obs["conditionSummary"] = safe_text(obs.get("conditionSummary", ""), 200)
                      obs["relaxSuggestions"] = []
                  state["query"] = ""
                  state["pending"] = {}
                  raw = _s_json(state)
                  if len(raw.encode("utf-8")) > state["cfg"]["maxStateBytes"]:
                      state["lockedConstraints"] = {}
                      state["observations"] = [{k: o[k] for k in ("ref", "tool", "ok", "count", "errorCategory") if k in o} for o in state["observations"]]
                      raw = _s_json(state)
              return {"state": raw, "status": state["status"]}


          def _s_budget(state, tool=False):
              cfg = state["cfg"]
              if time.time() - state["startedAt"] >= cfg["softDeadlineSeconds"]:
                  return _s_stop(state, "BUDGET_EXCEEDED", "SOFT_DEADLINE")
              if tool:
                  if state["toolCalls"] >= cfg["maxToolCalls"]:
                      return _s_stop(state, "BUDGET_EXCEEDED", "TOOL_CALL_LIMIT")
              elif state["step"] >= cfg["maxSteps"] or state["llmCalls"] >= cfg["maxLlmCalls"]:
                  return _s_stop(state, "BUDGET_EXCEEDED", "PLANNER_CALL_LIMIT")
              return state


          def _s_public(state):
              """Only safe task/evidence goes to the model; resource IDs remain code-side."""
              constraints = json.loads(_s_json(state["lockedConstraints"]))
              for key in ("albumId", "personId"):
                  if isinstance(constraints.get("parameters"), dict):
                      constraints["parameters"].pop(key, None)
              return {"query": state["query"], "referenceDate": state["referenceDate"], "timezone": state["timezone"],
                      "requiredGoals": state["requiredGoals"], "completedGoals": state["completedGoals"],
                      "lockedConstraints": constraints, "requestedLimit": state["requestedLimit"],
                      "allowTagAlternatives": state["allowTagAlternatives"], "nextAction": state["nextAction"],
                      "observations": state["observations"], "step": state["step"],
                      "pageSize": state["cfg"]["pageSize"], "maxCollectedRecords": state["cfg"]["maxCollectedRecords"],
                      "remainingToolCalls": state["cfg"]["maxToolCalls"] - state["toolCalls"]}


          def prepare(state):
              state = _s_load(state)
              if state["status"] == "RUNNING":
                  _s_budget(state)
              if state["status"] == "RUNNING":
                  state["step"] += 1
                  state["llmCalls"] += 1
              result = _s_output(state)
              result.update(shouldPlan="yes" if state["status"] == "RUNNING" else "no",
                            first="yes" if state["step"] == 1 else "no",
                            plannerInput=_s_json(_s_public(state)))
              return result


          def main(state) -> dict:
              return prepare(state)
        variables:
        - variable: state
          value_selector:
          - read_loop
          - state
        outputs:
          state:
            type: string
            children: null
          status:
            type: string
            children: null
          shouldPlan:
            type: string
            children: null
          first:
            type: string
            children: null
          plannerInput:
            type: string
            children: null
        isInIteration: false
        isInLoop: true
        loop_id: read_loop
