          role: user
          text: |-
            Current user input: {{#sys.query#}}

            Classify only this input. Output JSON only.
            Latest explicitly saved attachment fileId: {{#conversation.attachment_file_id#}}. Use this ID only when the user refers to that saved attachment.
        selected: false
        title: 识别写操作
        type: llm
        vision:
          enabled: false
      height: 87
      id: extract_write_action
      position:
        x: -70
        y: 160
      positionAbsolute:
        x: -70
        y: 160
