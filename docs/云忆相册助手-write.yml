    - data:
        code: |
          def main(raw: str) -> dict:
              import json
              try:
                  value = json.loads(raw or "{}")
                  data = value.get("data") or {}
              except Exception:
                  data = {}
              status = str(data.get("status") or "UNKNOWN")
              progress = int(data.get("progressPercent") or 0)
              suggestions = data.get("suggestions") or []
              files = data.get("files") or []
              suggestions_by_file = {}
              for item in suggestions:
                  item = item or {}
                  file_id = str(item.get("fileId") or "").strip()
                  name = str((item or {}).get("tagName") or "").strip()
                  if file_id and name:
                      names = suggestions_by_file.setdefault(file_id, [])
                      if name not in names:
                          names.append(name)
              status_names = {
                  "SUBMITTED": "已提交，等待后台处理",
                  "RUNNING": "处理中",
                  "SUCCEEDED": "已完成",
                  "PARTIAL_SUCCEEDED": "部分完成",
                  "FAILED": "失败",
              }
              text = f"AI 标签任务{status_names.get(status, status)}，进度 {progress}%。本任务只生成标签建议，没有修改照片。"
              file_lines = []
              for item in files[:50]:
                  item = item or {}
                  file_id = str(item.get("fileId") or "").strip()
                  file_name = str(item.get("originFileName") or "").replace("\n", " ").strip()
                  if not file_id:
                      continue
                  label = f"{file_name or '未命名图片'}"
                  names = suggestions_by_file.get(file_id) or []
                  if names:
                      label += "：" + "、".join(names[:20])
                  elif status in {"SUCCEEDED", "PARTIAL_SUCCEEDED", "FAILED"}:
                      label += "：没有达到置信度阈值的候选标签"
                  else:
                      label += "：等待分析"
                  file_lines.append("- " + label)
              if file_lines:
                  text += "\n\n分析对象与结果：\n" + "\n".join(file_lines)
              if suggestions:
                  text += "\n\n可回复「应用全部建议」或明确标签名称，进入写入预览。"
              failures = data.get("failureSummaries") or []
              if failures:
                  text += "\n\n失败信息：" + "；".join(str(item) for item in failures[:10])
              return {"message": text}
        code_language: python3
        outputs:
          message:
            children: null
            type: string
        title: 整理 AI 任务状态
