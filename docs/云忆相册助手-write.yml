app:
  description: Cloud-Album assistant for search, AI tags, people maintenance,
    attachments, sharing, downloads and deletion. All mutations use explicit
    server-backed confirmation; high-risk confirmations expire quickly.
  icon: 🤖
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 云忆相册助手
  use_icon_as_answer_icon: false
dependencies:
- current_identifier:
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: 
      langgenius/tongyi:0.1.48@966d88dc40611f067311c1c9839139ebc4b55bff471bc5e736dc3e828bc67b46
    version:
kind: app
version: 0.6.0
workflow:
  conversation_variables:
  - description: 服务端待确认操作 ID
    id: 9e79928e-55a4-4e7e-8d47-43101f3bf661
    name: pending_action_id
    selector:
    - conversation
    - pending_action_id
    value: ''
    value_type: string
  - description: 一次性确认凭证，只允许流向执行或取消工具
    id: 5f2845ef-ea5d-45b4-a58d-0d2878e709e0
    name: pending_confirmation_token
    selector:
    - conversation
    - pending_confirmation_token
    value: ''
    value_type: string
  - description: 安全网络重试使用的幂等键
    id: c68e3c45-6ce1-4af4-925f-427e8cd30acd
    name: pending_idempotency_key
    selector:
    - conversation
    - pending_idempotency_key
    value: ''
    value_type: string
  - description: 待确认操作族 album、tag、ai_task 或 suggested_tag
    id: 108ef7ce-87e0-4f0e-8ff0-7236a6776ff3
    name: pending_family
    selector:
    - conversation
    - pending_family
    value: ''
    value_type: string
  - description: 待确认操作过期时间
    id: 189ab652-a1e4-4766-844e-a4c82abe320d
    name: pending_expires_at
    selector:
    - conversation
    - pending_expires_at
    value: ''
    value_type: string
  - description: 最近一次 AI 标签建议批次 ID
    id: 70a35d1a-4040-4cf9-b2d8-520a1b252acf
    name: agent_task_id
    selector:
    - conversation
    - agent_task_id
    value: ''
    value_type: string
  - description: 最近一次明确保存的附件标识
    id: 6d9c5b1e-31b4-4f9d-bb6c-3fa2e80b1d92
    name: attachment_file_id
    selector: [conversation, attachment_file_id]
    value: ''
    value_type: string
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: true
        number_limits: 1
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 1
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
