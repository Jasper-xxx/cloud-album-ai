# Route only Cloud-Album's local backend directly instead of selecting the
# sandbox originserver peer. Keep the SSRF proxy and all other routing intact.
acl cloud_album_backend dstdomain host.docker.internal
acl cloud_album_backend_port port 8088
always_direct allow cloud_album_backend cloud_album_backend_port
# Tool responses can contain private library data; never reuse a cached response.
cache deny cloud_album_backend cloud_album_backend_port
